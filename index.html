<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LAUM Vending</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LAUM Vending">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0e1a">
<link rel="apple-touch-icon" href="logophone.png">
<link rel="apple-touch-startup-image" href="logophone.png">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0e1a;--surface:#0f172a;--surface-2:#1a2235;--border:#1e293b;--border-hover:#334155;--text:#e2e8f0;--text-dim:#94a3b8;--text-mute:#64748b;--primary:#3b82f6;--primary-2:#06b6d4;--accent:#f97316;--success:#22c55e;--warning:#facc15;--danger:#ef4444}
body{font-family:'Sarabun',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}

.login-bg{position:fixed;inset:0;background:#0a0e1a}
.login-video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;opacity:0.15;pointer-events:none;z-index:0}
.login-overlay{position:fixed;inset:0;background:linear-gradient(135deg,rgba(30,58,138,0.5) 0%,rgba(10,14,26,0.7) 50%,rgba(249,115,22,0.2) 100%);z-index:0;pointer-events:none}
.login-grid{position:fixed;inset:0;background-image:linear-gradient(rgba(59,130,246,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(59,130,246,0.04) 1px,transparent 1px);background-size:50px 50px;animation:pan 30s linear infinite;z-index:0}
@keyframes pan{0%{background-position:0 0}100%{background-position:50px 50px}}
.lwrap{position:relative;z-index:10;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.lcard{background:rgba(15,23,42,0.7);backdrop-filter:blur(24px);border:1px solid rgba(59,130,246,0.2);border-radius:24px;padding:40px;width:100%;max-width:380px;box-shadow:0 30px 80px rgba(0,0,0,0.5),0 0 60px rgba(59,130,246,0.1);position:relative;overflow:hidden}
.lcard::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,#3b82f6,transparent)}
.llogo{display:flex;justify-content:center;margin-bottom:20px}
.llogo img{width:100px;height:100px;border-radius:22px;box-shadow:0 12px 40px rgba(59,130,246,0.3);object-fit:cover;display:block}
.ltitle{text-align:center;font-size:24px;font-weight:700;letter-spacing:1px;margin-bottom:6px;background:linear-gradient(135deg,#fff 30%,#94a3b8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.lsubtitle{text-align:center;font-size:11px;color:var(--text-mute);margin-bottom:32px;letter-spacing:2px;text-transform:uppercase}
.linput{width:100%;padding:15px 18px;background:rgba(255,255,255,0.03);border:1.5px solid var(--border);border-radius:12px;color:var(--text);font-size:18px;outline:none;font-family:'Space Grotesk',monospace;letter-spacing:8px;text-align:center;transition:all .25s;margin-bottom:16px;caret-color:var(--primary)}.linput::placeholder{letter-spacing:6px;font-size:14px;color:var(--text-mute)}
.linput:focus{border-color:var(--primary);background:rgba(59,130,246,0.05);box-shadow:0 0 0 4px rgba(59,130,246,0.1)}
.linput.err{border-color:var(--danger);animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.lerr{color:var(--danger);font-size:11px;text-align:center;margin-bottom:10px}
.lbtn{width:100%;padding:14px;background:linear-gradient(135deg,var(--primary),var(--primary-2));border:none;border-radius:12px;color:#fff;font-weight:700;font-size:14px;cursor:pointer;letter-spacing:1px;transition:all .25s;font-family:'Sarabun',sans-serif}
.lbtn:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(59,130,246,0.4)}
.lfooter{text-align:center;font-size:10px;color:var(--text-mute);margin-top:20px;letter-spacing:1px}

.topbar{border-bottom:1px solid var(--border);padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:56px;background:rgba(10,14,26,0.85);backdrop-filter:blur(20px);position:sticky;top:0;z-index:50}
.tb-logo{display:flex;align-items:center;gap:10px}
.tb-logo img{width:36px;height:36px;border-radius:9px;object-fit:cover;display:block}
.tb-title{font-weight:700;font-size:15px;letter-spacing:1px}
.tb-sub{font-size:9px;color:var(--text-mute);letter-spacing:1.5px;text-transform:uppercase}
.tb-right{display:flex;align-items:center;gap:10px}
.tb-stat{display:flex;align-items:center;gap:6px;padding:5px 11px;background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.3);border-radius:20px;font-size:11px;color:var(--success);font-weight:600}
.tb-btn{padding:6px 12px;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:8px;color:var(--text-dim);cursor:pointer;font-size:11px;font-family:'Sarabun',sans-serif}
.tb-btn:hover{background:rgba(255,255,255,0.1);color:var(--text)}

.fleet-view{min-height:calc(100vh - 56px);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:30px 20px;position:relative;overflow:hidden}
.fleet-bg{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(59,130,246,0.08) 0%,transparent 60%);pointer-events:none}
.fleet-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0.12;pointer-events:none;z-index:0}
.fleet-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(10,14,26,0.3) 0%,rgba(10,14,26,0.6) 100%);pointer-events:none;z-index:0}
.fleet-header{text-align:center;margin-bottom:20px;z-index:5;position:relative}
.fleet-title{font-size:24px;font-weight:800;letter-spacing:2px;margin-bottom:4px;background:linear-gradient(135deg,#fff,#94a3b8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.fleet-sub{font-size:10px;color:var(--text-mute);letter-spacing:3px;text-transform:uppercase}

.orbital-stage{position:relative;width:520px;height:520px;max-width:92vw;max-height:92vw;display:flex;align-items:center;justify-content:center}
.orbital-ring{position:absolute;border:1px solid rgba(59,130,246,0.18);border-radius:50%;pointer-events:none}
.orbital-ring.r1{width:260px;height:260px;border-style:dashed;animation:spin1 80s linear infinite}
.orbital-ring.r2{width:420px;height:420px;border-color:rgba(59,130,246,0.1);animation:spin2 120s linear infinite}
@keyframes spin1{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes spin2{from{transform:rotate(360deg)}to{transform:rotate(0)}}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}

.orbital-center{position:absolute;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(59,130,246,0.3) 0%,transparent 70%);display:flex;align-items:center;justify-content:center;z-index:5}
.orbital-center::before{content:'';position:absolute;inset:-10px;border-radius:50%;background:radial-gradient(circle,rgba(59,130,246,0.15) 0%,transparent 70%);animation:pulse 3s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.3);opacity:.2}}
.orbital-hub{width:90px;height:90px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary-2));display:flex;align-items:center;justify-content:center;box-shadow:0 0 40px rgba(59,130,246,0.5);overflow:hidden}
.orbital-hub img{width:70px;height:70px;border-radius:14px;object-fit:cover;display:block}

.orbit-system{position:absolute;width:100%;height:100%;animation:orbit-rotate 60s linear infinite}.orbital-stage:hover .orbit-system,.orbital-stage:hover .machine-node{animation-play-state:paused}
@keyframes orbit-rotate{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.machine-node{position:absolute;top:50%;left:50%;cursor:pointer;z-index:10;animation:orbit-counter 60s linear infinite}
@keyframes orbit-counter{from{transform:translate(-50%,-50%) rotate(0deg)}to{transform:translate(-50%,-50%) rotate(-360deg)}}
.mn-inner{transition:transform .3s ease}
.machine-node:hover{z-index:20}
.machine-node:hover .mn-inner{transform:scale(1.18)}
.mn-circle{width:96px;height:96px;border-radius:50%;background:rgba(15,23,42,0.96);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:8px;transition:all .3s;backdrop-filter:blur(10px);position:relative;overflow:hidden}
.machine-node:hover .mn-circle{border-color:var(--primary);box-shadow:0 0 30px rgba(59,130,246,0.4)}
.mn-circle.empty{border-style:dashed;border-color:var(--border-hover);background:rgba(15,23,42,0.5)}
.mn-name{font-size:10px;font-weight:700;color:var(--text);line-height:1.2;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mn-stat{font-size:8px;color:var(--text-mute);margin-top:2px}
.mn-rev{font-size:11px;color:var(--success);font-weight:700;margin-top:1px;font-family:'Space Grotesk',monospace}
.mn-dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--success);box-shadow:0 0 8px rgba(34,197,94,0.6)}
.mn-dot.off{background:var(--text-mute);box-shadow:none}
.mn-alert{position:absolute;top:-4px;left:-4px;min-width:22px;height:22px;border-radius:50%;background:var(--danger);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg);padding:0 5px}
.mn-add{font-size:32px;font-weight:300;color:var(--text-mute)}

.fleet-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;max-width:700px;width:100%;margin-top:30px;z-index:5;position:relative}
.fs-card{background:rgba(15,23,42,0.6);backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:14px;padding:14px;text-align:center}
.fs-ic{font-size:18px;margin-bottom:5px}
.fs-v{font-size:18px;font-weight:700;font-family:'Space Grotesk',monospace}
.fs-l{font-size:9px;color:var(--text-mute);letter-spacing:1px;text-transform:uppercase;margin-top:3px}

.detail-view{padding:20px;max-width:1400px;margin:0 auto;position:relative;z-index:1}
.detail-video{display:none}
.detail-voverlay{display:none}
.back-btn{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:9px;color:var(--text-dim);cursor:pointer;font-size:12px;font-family:'Sarabun',sans-serif;margin-bottom:16px;transition:all .2s}
.back-btn:hover{background:rgba(255,255,255,0.1);color:var(--text);transform:translateX(-2px)}
.dt-header{background:linear-gradient(135deg,rgba(59,130,246,0.08),rgba(6,182,212,0.05));border:1px solid rgba(59,130,246,0.2);border-radius:16px;padding:18px 22px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.dt-id{font-size:10px;color:var(--text-mute);letter-spacing:1.5px;font-family:'Space Grotesk',monospace}
.dt-name{font-size:22px;font-weight:800;margin:3px 0}
.dt-loc{font-size:13px;color:var(--text-dim)}
.dt-status{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.dt-badge{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600}
.dt-badge.on{background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.3);color:var(--success)}
.dt-badge.off{background:rgba(107,114,128,0.1);border:1px solid rgba(107,114,128,0.3);color:#6b7280}
.dot-live{width:8px;height:8px;border-radius:50%;background:var(--success);position:relative}
.dot-live::after{content:'';position:absolute;inset:0;border-radius:50%;background:var(--success);animation:ping 1.5s infinite}
@keyframes ping{0%{transform:scale(1);opacity:.6}100%{transform:scale(2.5);opacity:0}}

.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tab{padding:9px 18px;border-radius:10px;border:1px solid var(--border);background:rgba(15,23,42,0.6);cursor:pointer;font-size:13px;color:var(--text-dim);font-family:'Sarabun',sans-serif;font-weight:600;transition:all .2s}
.tab.on{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;border-color:transparent;box-shadow:0 6px 20px rgba(59,130,246,0.25)}
.tab:hover:not(.on){border-color:var(--border-hover);color:var(--text)}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi{background:rgba(15,23,42,0.6);border:1px solid var(--border);border-radius:14px;padding:16px;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--c)}
.kpi-ic{width:38px;height:38px;margin-bottom:9px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.04)}
.kpi-ic svg{width:20px;height:20px}
.fs-ic-svg{width:34px;height:34px;margin:0 auto 7px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.04)}
.fs-ic-svg svg{width:18px;height:18px}
.tab svg{width:15px;height:15px;vertical-align:-2px;margin-right:5px}
.alert svg{width:17px;height:17px;flex-shrink:0}
.chart-ic svg{width:15px;height:15px;vertical-align:-2px;margin-right:5px}
.kpi-v{font-size:20px;font-weight:800;font-family:'Space Grotesk',monospace}
.kpi-l{font-size:10px;color:var(--text-mute);letter-spacing:1px;text-transform:uppercase;margin-top:4px}
.alert{border-radius:11px;padding:11px 14px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:10px;margin-bottom:8px}
.chart-card{background:rgba(15,23,42,0.6);border:1px solid var(--border);border-radius:14px;padding:16px;margin-top:8px}
.chart-wrap{display:flex;align-items:flex-end;gap:6px;height:90px}
.chart-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.chart-bar{width:100%;border-radius:4px 4px 0 0;background:linear-gradient(180deg,var(--primary),var(--primary-2));min-height:4px;box-shadow:0 0 12px rgba(59,130,246,0.3)}

.slot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.scard{background:rgba(15,23,42,0.6);border-radius:14px;border:1px solid var(--border);overflow:hidden;transition:all .2s}
.scard:hover{transform:translateY(-3px);border-color:var(--border-hover)}
.scard-img{width:100%;height:100px;background:rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:center;font-size:42px;cursor:pointer;overflow:hidden}
.scard-img img{width:100%;height:100%;object-fit:contain}
.scard-body{padding:11px}
.bar-bg{background:rgba(0,0,0,0.4);border-radius:4px;height:5px;overflow:hidden;margin:6px 0}
.bar-fill{height:100%;border-radius:4px;transition:width .5s}
.badge{font-size:9px;font-weight:700;border-radius:20px;padding:2px 8px;letter-spacing:0.5px}

.rfrow{display:grid;grid-template-columns:60px 2fr 1fr 1fr 1fr;gap:10px;align-items:center;padding:11px 14px;border-radius:11px;border:1px solid var(--border);background:rgba(15,23,42,0.6);font-size:12px}
.rfrow.hdr{background:rgba(30,41,59,0.5);border-color:transparent;font-size:10px;color:var(--text-mute);font-weight:700;letter-spacing:1px;text-transform:uppercase}
.rfrow.urg{border-color:rgba(239,68,68,0.3);background:rgba(239,68,68,0.05)}
.btn-reset{width:36px;height:36px;border-radius:8px;border:1px solid var(--border);background:rgba(255,255,255,0.03);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-mute);transition:all .2s;padding:0;margin:0 auto}
.btn-reset svg{width:16px;height:16px}
.btn-reset:hover{border-color:var(--primary);color:var(--primary);background:rgba(59,130,246,0.1);transform:rotate(180deg)}
.period-btn{padding:5px 11px;border-radius:7px;border:1px solid var(--border);background:transparent;cursor:pointer;font-size:11px;color:var(--text-mute);font-family:'Sarabun',sans-serif;transition:all .15s}
.period-btn:hover{border-color:var(--border-hover);color:var(--text)}
.period-btn.active{background:rgba(59,130,246,0.15);border-color:rgba(59,130,246,0.4);color:var(--primary);font-weight:700}
.rfimg{width:46px;height:46px;border-radius:9px;background:rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden}
.rfimg img{width:100%;height:100%;object-fit:contain}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);display:flex;align-items:center;justify-content:center;z-index:99;backdrop-filter:blur(8px)}
.modal{background:rgba(15,23,42,0.95);border-radius:18px;padding:26px;width:90%;max-width:440px;border:1px solid rgba(59,130,246,0.2);max-height:90vh;overflow-y:auto}
.btn{padding:10px 16px;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,0.03);cursor:pointer;font-size:13px;color:var(--text);font-family:'Sarabun',sans-serif;font-weight:600;transition:all .2s}
.btn.pri{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;border-color:transparent}
.btn:hover{transform:translateY(-1px)}
.type-card{display:flex;align-items:center;justify-content:space-between;width:100%;padding:13px 16px;border-radius:12px;border:1.5px solid var(--border);background:rgba(255,255,255,0.02);cursor:pointer;transition:all .2s;font-family:'Sarabun',sans-serif;text-align:left}
.type-card:hover{border-color:var(--border-hover);background:rgba(255,255,255,0.04)}
.type-card.on{border-color:var(--primary);background:rgba(59,130,246,0.08)}
.type-name{font-size:14px;font-weight:700;color:var(--text)}
.type-desc{font-size:11px;color:var(--text-mute);margin-top:2px}
.type-check{width:22px;height:22px;color:var(--primary)}
.type-check svg{width:22px;height:22px}
input,textarea{background:rgba(0,0,0,0.3);border:1px solid var(--border);border-radius:10px;padding:11px 14px;color:var(--text);font-size:13px;outline:none;width:100%;font-family:'Sarabun',sans-serif}
input:focus,textarea:focus{border-color:var(--primary)}
textarea{resize:none;font-family:monospace;font-size:11px}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

@media(max-width:700px){
  .orbital-stage{width:92vw;height:92vw}
  .orbital-ring.r1{width:55vw;height:55vw}
  .orbital-ring.r2{width:85vw;height:85vw}
  .mn-circle{width:80px;height:80px}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .fleet-stats{grid-template-columns:repeat(2,1fr)}
  .rfrow{grid-template-columns:50px 2fr 1fr 1fr;font-size:11px}
  .rfrow div:nth-child(5){display:none}
}
</style>
</head>
<body>

// แปลง product objects จาก Apps Script → slots array
function productsToSlots(products) {
  const typeEmoji = {"กระป๋อง":"🥤","ขวดแก้ว":"🧃","ขวด":"💧"};
  return products.map(p => {
    const max = parseInt(p.maxQty) || 20;
    // stock จาก K — ถ้า Apps Script ส่ง null/undefined มาให้ default เป็น max
    const cur = (p.stock !== null && p.stock !== undefined && !isNaN(parseInt(p.stock)))
                  ? Math.min(parseInt(p.stock), max)   // ไม่เกิน max
                  : max;
    return {
      s:    p.slot,
      n:    p.name,
      e:    typeEmoji[p.type] || "🥤",
      img:  p.imgUrl || "",
      p:    parseFloat(p.price) || 15,
      mx:   max,
      c:    cur,
      type: p.type || "ขวด",
      cost: parseFloat(p.cost) || 0,
    };
  }).sort((a,b) => a.s - b.s);
}

// ดึงข้อมูลผ่าน Apps Script URL
async function fetchSheetData(machineId, gasUrl) {
  if (!gasUrl || !gasUrl.trim()) {
    throw new Error("กรุณาใส่ URL");
  }
  const url = gasUrl.trim();
  // ต่อ ?action=products (รองรับ URL มี / ท้ายหรือไม่มีก็ได้)
  const fetchUrl = url.includes("?") ? url + "&action=products" : url + "?action=products";
  
  let res;
  try {
    res = await fetch(fetchUrl, {
      method: "GET",
      redirect: "follow",   // ← สำคัญมาก! Apps Script ใช้ redirect
      cache: "no-store",
    });
  } catch(e) {
    throw new Error("เชื่อมต่อไม่ได้: " + e.message + "\n(ตรวจสอบ internet หรือ CORS)");
  }
  
  if (!res.ok) throw new Error("HTTP " + res.status + " — ตรวจสอบ URL อีกครั้ง");
  
  let json;
  try {
    json = await res.json();
  } catch(e) {
    throw new Error("URL นี้ไม่ใช่ Apps Script หรือยังไม่ได้ Deploy");
  }
  
  if (!json.ok) throw new Error(json.error || "Apps Script ตอบกลับผิดพลาด");
  if (!json.products || !json.products.length) throw new Error("ไม่พบข้อมูลสินค้าใน Sheet");
  
  const slots = productsToSlots(json.products);
  const now = new Date().toLocaleTimeString("th-TH", {hour:"2-digit", minute:"2-digit"});
  ST.machines = ST.machines.map(m =>
    m.id === machineId ? {...m, slots, sheetUrl: gasUrl, lastSync: now} : m
  );
  saveState();
  return slots.length;
}
function ci(m){return m.slots.reduce((a,s)=>a+s.c,0)}
function tm(m){return m.slots.reduce((a,s)=>a+s.mx,0)}
function rf(m){return m.slots.reduce((a,s)=>a+(s.mx-s.c),0)}
function selM(){return ST.machines.find(m=>m.id===ST.sel)}

// ดึงสรุปรายได้/กำไร/ต้นทุนจาก log ผ่าน Apps Script
async function fetchSummary(gasUrl, period){
  if(!gasUrl||!gasUrl.trim())return null;
  const url=gasUrl.trim()+(gasUrl.includes('?')?'&':'?')+'action=summary&period='+period;
  try{
    const res=await fetch(url,{method:"GET",redirect:"follow",cache:"no-store"});
    if(!res.ok)return null;
    const json=await res.json();
    return json.ok?json:null;
  }catch(e){return null;}
}

// ── Toast / Confirm UI (แทน confirm() ที่ถูก block) ──────────────────────
function showToast(msg, type='info', onConfirm=null){
  // ลบ toast เก่า
  const old=document.getElementById('toast-wrap');
  if(old)old.remove();

  const wrap=document.createElement('div');
  wrap.id='toast-wrap';
  wrap.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none';

  if(type==='confirm'&&onConfirm){
    wrap.style.pointerEvents='auto';
    wrap.innerHTML=`
      <div style="background:#0f172a;border:1px solid rgba(59,130,246,0.4);border-radius:14px;padding:14px 18px;box-shadow:0 8px 30px rgba(0,0,0,0.5);min-width:260px;text-align:center">
        <div style="font-size:13px;color:#e2e8f0;margin-bottom:12px;font-weight:500">${msg}</div>
        <div style="display:flex;gap:8px;justify-content:center">
          <button id="toast-cancel" style="padding:8px 18px;border-radius:8px;border:1px solid #334155;background:transparent;color:#94a3b8;cursor:pointer;font-size:12px;font-family:'Sarabun',sans-serif">ยกเลิก</button>
          <button id="toast-ok" style="padding:8px 18px;border-radius:8px;border:none;background:linear-gradient(135deg,#3b82f6,#06b6d4);color:#fff;cursor:pointer;font-size:12px;font-weight:600;font-family:'Sarabun',sans-serif">ยืนยัน</button>
        </div>
      </div>`;
    document.body.appendChild(wrap);
    document.getElementById('toast-ok').onclick=()=>{wrap.remove();onConfirm();};
    document.getElementById('toast-cancel').onclick=()=>wrap.remove();
  } else {
    const bg=type==='success'?'rgba(34,197,94,0.15)':type==='error'?'rgba(239,68,68,0.15)':'rgba(59,130,246,0.15)';
    const bc=type==='success'?'rgba(34,197,94,0.4)':type==='error'?'rgba(239,68,68,0.4)':'rgba(59,130,246,0.4)';
    const tc=type==='success'?'#22c55e':type==='error'?'#ef4444':'#38bdf8';
    wrap.innerHTML=`<div style="background:${bg};border:1px solid ${bc};border-radius:10px;padding:10px 20px;color:${tc};font-size:13px;font-weight:500;box-shadow:0 4px 16px rgba(0,0,0,0.3)">${msg}</div>`;
    document.body.appendChild(wrap);
    setTimeout(()=>wrap.remove(),2500);
  }
}

        </div>
        <div style="text-align:center">
          <span style="color:${u?'var(--danger)':'var(--text-dim)'};font-size:14px;font-weight:${u?'700':'500'}">${s.c}</span>
          <span style="color:var(--text-mute);font-size:11px">/${s.mx}</span>
        </div>
        <div style="text-align:center;color:${r>0?'var(--primary)':'var(--success)'};font-size:14px;font-weight:700">${r>0?'+'+r:'✓'}</div>

            ${ICON.cycle}
          </button>
        </div>
      </div>`;
    });
    h+=`</div>`;
  }
  h+=`</div>`;
  return h;

        <button class="btn pri" id="img-save" style="flex:2">💾 บันทึก</button>
      </div>
    </div></div>`;
  }
  return"";
}

function bind(){
  const g=id=>document.getElementById(id);
  const on=(id,e,fn)=>{const el=g(id);if(el)el.addEventListener(e,fn)};
  on('pwi','input',e=>{ST.pw=e.target.value;ST.err=false});
  on('pwi','keydown',e=>{if(e.key==='Enter')doLogin()});
  on('lbtn','click',doLogin);
  on('btn-refresh','click',async()=>{
    const m=selM();
    if(!m||!m.sheetUrl)return;
    const btn=document.getElementById('btn-refresh');
    if(btn){btn.style.opacity='0.5';btn.style.pointerEvents='none';}
    try{
      const count=await fetchSheetData(ST.sel,m.sheetUrl);
      // โหลด summary ด้วยถ้าอยู่หน้า dash
      if(ST.tab==='dash'){
        ST.summaryLoading=true;render();
        ST.summary=await fetchSummary(m.sheetUrl,ST.period);
        ST.summaryLoading=false;
      }
      render();
      showToast(`✅ อัปเดตแล้ว ${count} รายการ`,'success');
    }catch(err){
      showToast('❌ '+err.message,'error');
      if(btn){btn.style.opacity='1';btn.style.pointerEvents='auto';}
    }
  });

  // period selector
  document.querySelectorAll('.period-btn').forEach(el=>el.addEventListener('click',async()=>{
    ST.period=el.dataset.period;
    const m=selM();
    if(m&&m.sheetUrl){
      ST.summaryLoading=true;render();
      ST.summary=await fetchSummary(m.sheetUrl,ST.period);
      ST.summaryLoading=false;
    }
    render();
  }));

  // load summary button
  on('btn-load-summary','click',async()=>{
    const m=selM();if(!m||!m.sheetUrl)return;
    ST.summaryLoading=true;render();
    ST.summary=await fetchSummary(m.sheetUrl,ST.period);
    ST.summaryLoading=false;render();
  });
  on('logout','click',()=>{ST.in=false;ST.pw='';ST.view='fleet';render()});
  on('back-fleet','click',()=>{ST.view='fleet';ST.sel=null;render();loadFleetSummary();});
  document.querySelectorAll('[data-mid]').forEach(el=>el.addEventListener('click',()=>{ST.sel=el.dataset.mid;ST.view='detail';ST.tab='dash';render()}));
  document.querySelectorAll('[data-add]').forEach(el=>el.addEventListener('click',()=>{ST.modal='add';render()}));
  document.querySelectorAll('[data-tab]').forEach(el=>el.addEventListener('click',()=>{ST.tab=el.dataset.tab;render()}));
  on('btn-sheet','click',()=>{const m=selM();ST.su=m?m.sheetUrl:'';ST.modal='sheet';render()});
  document.querySelectorAll('[data-imgslot]').forEach(el=>el.addEventListener('click',()=>{
    const sn=parseInt(el.dataset.imgslot);
    const m=selM();const s=m?.slots.find(x=>x.s===sn);
    ST.imgSlot=sn;ST.imgInput=s?.img||'';ST.modal='img';render();
  }));
  document.querySelectorAll('[data-n]').forEach(el=>el.addEventListener('click',()=>{ST.af.n=el.dataset.n;render()}));
  on('an','input',e=>{ST.af.name=e.target.value});
  on('al','input',e=>{ST.af.loc=e.target.value});
  on('ac','click',()=>{
    const f=ST.af;if(!f.name.trim()||!f.loc.trim())return;
    const typeMap={'30':30,'36':36,'spiral':60};
    const n=typeMap[f.n]||30;
    const typeName={'30':'ตู้ 30 ช่อง','36':'ตู้ 36 ช่อง','spiral':'ตู้เกลียว'}[f.n]||'ตู้ 30 ช่อง';
    const nm={id:'M'+Date.now().toString().slice(-4),name:f.name.trim(),loc:f.loc.trim(),type:typeName,on:false,rev:0,sold:0,sheetUrl:'',
      slots:Array.from({length:n},(_,i)=>({s:i+1,n:'ช่องที่ '+(i+1),e:'🥤',img:'',p:15,mx:20,c:0}))};
    ST.machines.push(nm);ST.af={name:'',loc:'',n:'30'};ST.modal='';saveState();render();
  });
  on('su','input',e=>{ST.su=e.target.value});
  on('ss-fetch','click',async()=>{
    const url=ST.su.trim();
    if(!url){
      const el=document.getElementById('sheet-status');
      if(el)el.innerHTML='<div style="color:var(--warning);font-size:11px;padding:6px 10px;background:rgba(250,204,21,0.08);border:1px solid rgba(250,204,21,0.3);border-radius:8px">⚠️ กรุณาใส่ URL ก่อน</div>';
      return;
    }
    const statusEl=document.getElementById('sheet-status');
    if(statusEl)statusEl.innerHTML='<div style="color:var(--text-dim);font-size:11px;padding:6px 10px;background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:8px;display:flex;align-items:center;gap:8px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="animation:spin 1s linear infinite"><path d="M21 12a9 9 0 1 1-6.22-8.56"/></svg> กำลังดึงข้อมูลจาก Sheet...</div>';
    try{
      const count = await fetchSheetData(ST.sel, url);
      ST.modal='';render();
      setTimeout(()=>alert('✅ โหลดสำเร็จ! พบสินค้า '+count+' รายการ'),100);
    }catch(err){
      if(statusEl)statusEl.innerHTML=`<div style="color:var(--danger);font-size:11px;padding:8px 10px;background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.3);border-radius:8px"><b>❌ ดึงข้อมูลไม่ได้</b><br>${err.message}<br><span style="color:var(--text-mute)">ตรวจสอบ: Sheet ต้องตั้งเป็น "ทุกคนที่มีลิงก์" และ Publish แล้ว</span></div>`;
    }
  });
  on('imgu','input',e=>{ST.imgInput=e.target.value;render()});
  on('img-save','click',()=>{
    const url=ST.imgInput.trim();
    ST.machines=ST.machines.map(m=>m.id===ST.sel?{...m,slots:m.slots.map(s=>s.s===ST.imgSlot?{...s,img:url}:s)}:m);
    ST.modal='';ST.imgSlot=null;ST.imgInput='';saveState();render();
  });
  on('img-clear','click',()=>{
    ST.machines=ST.machines.map(m=>m.id===ST.sel?{...m,slots:m.slots.map(s=>s.s===ST.imgSlot?{...s,img:''}:s)}:m);
    ST.modal='';ST.imgSlot=null;ST.imgInput='';saveState();render();
  });
  document.querySelectorAll('#mc').forEach(el=>el.addEventListener('click',()=>{ST.modal='';ST.imgSlot=null;ST.imgInput='';render()}));

  // ── Reset slot buttons (หน้าการเติม) ──
  document.querySelectorAll('.btn-reset').forEach(el=>el.addEventListener('click',e=>{
    e.stopPropagation();
    const slot=parseInt(el.dataset.slot);
    const max=parseInt(el.dataset.max);
    const name=el.dataset.name||('ช่อง '+slot);
    // แสดง toast confirm
    showToast(`รีเซ็ท ${name} → ${max}/${max} ?`, 'confirm', ()=>{
      ST.machines=ST.machines.map(m=>m.id===ST.sel?{...m,slots:m.slots.map(s=>s.s===slot?{...s,c:max}:s)}:m);
      saveState(); render();
      const mc=selM();
      if(mc&&mc.sheetUrl){
        fetch(mc.sheetUrl+(mc.sheetUrl.includes('?')?'&action=refill':'?action=noop'),
          {method:"POST",redirect:"follow",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({action:"refill",machineId:mc.id,slot})}).catch(()=>{});
      }
      showToast(`✅ ช่อง ${slot} รีเซ็ทแล้ว`,'success');
    });
  }));

  // ── Reset ALL button ──
  on('reset-all','click',()=>{
    const m=selM(); if(!m)return;
    const count=m.slots.filter(s=>s.mx-s.c>0).length;
    showToast(`รีเซ็ทสต็อกทั้งหมด ${count} รายการ?`,'confirm',()=>{
      ST.machines=ST.machines.map(mc=>mc.id===ST.sel?{...mc,slots:mc.slots.map(s=>({...s,c:s.mx}))}:mc);
      saveState(); render();
      if(m.sheetUrl){
        fetch(m.sheetUrl+(m.sheetUrl.includes('?')?'&action=refill_all':'?action=noop'),
          {method:"POST",redirect:"follow",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({action:"refill_all",machineId:m.id})}).catch(()=>{});
      }
      showToast('✅ รีเซ็ทสต็อกทั้งหมดแล้ว','success');
    });
  });
}

function doLogin(){
  if(ST.pw===PASS){ST.in=true;ST.err=false;setTimeout(loadFleetSummary,500);}
  else ST.err=true;
  render();
}

let resizeTimer;
window.addEventListener('resize',()=>{
  clearTimeout(resizeTimer);
  resizeTimer=setTimeout(()=>{if(ST.in&&ST.view==='fleet')render()},200);
});
render();
</script>
</body>
</html>
