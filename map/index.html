<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!--HEAD-START-->
<title>LAUM เขื่องใน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Anuphan:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed 3D diorama; brand chip top-left, site dock along the bottom, detail sheet docks right (bottom sheet on phones) */
:root{
  --bg:#d7ecee; --panel:#fffdf8; --fg:#22323b; --muted:#5f6f77; --line:#e4dfd2;
  --accent:#1b7cc2; --accent-soft:#e2f0fa; --ok:#25965a; --soon:#c97d10; --bad:#d2453a; --warn-soft:#fdf1dc; --bad-soft:#fbe4e1;
  --shadow:rgb(34 50 59 / .16);
  --day-top:#b9e2ef; --day-bot:#f4efe1; --night-top:#0c1830; --night-bot:#253252;
  --font-display:"Mitr","Anuphan",system-ui,sans-serif;
  --font-body:"Anuphan","Noto Sans Thai","Leelawadee UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1a22; --panel:#17232c; --fg:#e7eef1; --muted:#9aabb3; --line:#2b3a45;
  --accent:#5fb5f2; --accent-soft:#17334a; --ok:#4cc184; --soon:#f0a948; --bad:#f07a6e; --warn-soft:#3a2f1a; --bad-soft:#3d2220; --shadow:rgb(0 0 0 / .4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1a22; --panel:#17232c; --fg:#e7eef1; --muted:#9aabb3; --line:#2b3a45;
  --accent:#5fb5f2; --accent-soft:#17334a; --ok:#4cc184; --soon:#f0a948; --bad:#f07a6e; --warn-soft:#3a2f1a; --bad-soft:#3d2220; --shadow:rgb(0 0 0 / .4); color-scheme:dark}

[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;overflow:hidden}
#stage{position:fixed;inset:0;background:linear-gradient(180deg,var(--day-top),var(--day-bot) 75%)}
#stage::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,var(--night-top),var(--night-bot) 75%);opacity:var(--night,0);pointer-events:none}
#stage canvas{position:relative;z-index:1;display:block;touch-action:none;outline:none}
#stage.placing canvas{cursor:crosshair}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:2}

.brand{position:fixed;z-index:3;top:calc(env(safe-area-inset-top,0px) + 16px);left:16px;max-width:calc(100% - 32px);
  background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:10px 14px 10px 12px;
  display:flex;gap:10px;align-items:center;box-shadow:0 6px 20px var(--shadow)}
.brand svg{flex:none}
.brand h1{font-family:var(--font-display);font-weight:600;font-size:18px;line-height:1.2;margin:0}
.brand p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.live{display:inline-flex;align-items:center;gap:5px}
.live i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.live.on i{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}

.dock{position:fixed;z-index:3;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;flex-wrap:wrap;gap:8px;justify-content:center;pointer-events:none}
.dock button{pointer-events:auto}
.chip{font:500 14px/1 var(--font-display);color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:999px;
  padding:10px 14px;display:inline-flex;gap:8px;align-items:center;cursor:pointer;box-shadow:0 4px 14px var(--shadow);transition:transform .15s}
.chip:hover{transform:translateY(-2px)}
.chip small{font:400 12px/1 var(--font-body);color:var(--muted)}
.chip:focus-visible,.mlabel:focus-visible,.sheet button:focus-visible,.sheet a:focus-visible,.sheet input:focus-visible,.sheet select:focus-visible,.bar button:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--panel);border-color:var(--accent)}
.chip[aria-pressed="true"] small{color:inherit}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none}
.dot.soon{background:var(--soon)}

.mlabel{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;font:500 13px/1 var(--font-display);color:var(--fg);
  background:var(--panel);border:1.5px solid var(--line);border-radius:999px;padding:6px 10px 6px 8px;display:flex;gap:6px;align-items:center;
  white-space:nowrap;box-shadow:0 4px 12px var(--shadow)}
.mlabel small{font:400 11.5px/1 var(--font-body);color:var(--muted)}
.mlabel.mini{font-size:12px;padding:4px 8px;border-width:1px}
.lm{position:absolute;left:0;top:0;font:500 11.5px/1.2 var(--font-body);color:var(--fg);white-space:nowrap;
  background:color-mix(in srgb,var(--panel) 78%,transparent);border-radius:6px;padding:3px 7px}

.sheet{position:fixed;z-index:4;top:calc(env(safe-area-inset-top,0px) + 16px);right:16px;width:min(390px,calc(100% - 32px));
  max-height:calc(100% - 32px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:0 18px 50px var(--shadow);padding:14px 16px 16px}
.photo{display:block;margin:0 0 14px;border-radius:14px;overflow:hidden;background:var(--accent-soft)}
.photo img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.kicker{font:500 12px/1 var(--font-display);letter-spacing:.04em;color:var(--accent)}
.sheet h2{font:600 24px/1.2 var(--font-display);margin:6px 0 2px;padding-right:40px;text-wrap:balance}
.sheet h3{font:600 16px/1.3 var(--font-display);margin:18px 0 8px}
.place{margin:0 0 10px;color:var(--muted)}
.status{display:inline-flex;gap:7px;align-items:center;font:500 13px/1 var(--font-display);padding:6px 10px;border-radius:999px;background:var(--accent-soft)}
.mcard{border:1px solid var(--line);border-radius:16px;padding:10px 12px 12px;margin-top:10px}
.mcard[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 22%,transparent)}
.mhead{width:100%;display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;text-align:left;cursor:pointer;background:none;border:0;color:inherit;font:inherit;padding:0}
.mhead b{display:block;font:500 15px/1.25 var(--font-display)}
.mhead .sub{display:block;color:var(--muted);font-size:12.5px;line-height:1.4}
.mhead svg{display:block}
.stockbar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:10px 0 4px}
.stockbar i{display:block;height:100%;background:var(--ok);border-radius:3px}
.stockline{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.today{margin-top:8px;font-size:13px;background:var(--accent-soft);border-radius:10px;padding:7px 10px;font-variant-numeric:tabular-nums}
.pgrid{list-style:none;margin:10px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.pitem{border:1px solid var(--line);border-radius:12px;padding:6px;display:grid;gap:4px;min-width:0}
.pimg{aspect-ratio:1;border-radius:8px;background:var(--accent-soft);display:grid;place-items:center;overflow:hidden;font:600 18px/1 var(--font-display);color:var(--accent)}
.pimg img{width:100%;height:100%;object-fit:cover}
.pname{font-size:12px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:2.6em}
.pmeta{display:flex;justify-content:space-between;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.pmeta b{font:600 13px/1 var(--font-display)}
.tag{font-size:11px;border-radius:6px;padding:2px 5px;background:var(--accent-soft);color:var(--ok);white-space:nowrap}
.tag.low{background:var(--warn-soft);color:var(--soon)}
.tag.out{background:var(--bad-soft);color:var(--bad)}
.pitem.out .pimg{opacity:.45;filter:grayscale(1)}
.empty{color:var(--muted);font-size:13px;margin:10px 0 0}
.sheet dl{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;margin:14px 0;padding:14px 0;border-block:1px solid var(--line)}
.sheet dt{color:var(--muted);font-size:13px}
.sheet dd{margin:0;font-weight:500;min-width:0;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:500 14px/1 var(--font-display);border-radius:12px;padding:12px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.btn.small{padding:8px 10px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.55;cursor:default}
.close{position:sticky;float:right;top:0;z-index:1;width:34px;height:34px;margin:6px 6px 0 0;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer;font-size:18px;line-height:1;box-shadow:0 2px 8px var(--shadow)}
.sample{margin:12px 0 0;font-size:12px;color:var(--muted)}
.field{display:grid;gap:6px;margin:10px 0}
.field label{font-size:13px;color:var(--muted)}
.field input,.field select{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.err{color:var(--bad);font-size:13px;margin:6px 0 0}
.flist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.frow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.frow b{font:500 14px/1.3 var(--font-display)}
.frow span{display:block;font-size:12px;color:var(--muted)}
.frow .actions{flex-wrap:nowrap}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.kpi div{border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.kpi span{display:block;font-size:12px;color:var(--muted)}
.kpi b{font:600 18px/1.2 var(--font-display);font-variant-numeric:tabular-nums}
.bar{position:fixed;z-index:5;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 16px);width:min(520px,calc(100% - 32px));
  background:var(--panel);border:1.5px solid var(--accent);border-radius:16px;box-shadow:0 12px 34px var(--shadow);padding:12px 14px;display:grid;gap:10px}
.bar p{margin:0;font:500 14px/1.4 var(--font-display)}
.bar small{display:block;font:400 12.5px/1.4 var(--font-body);color:var(--muted);font-variant-numeric:tabular-nums}
.toast{position:fixed;z-index:6;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 76px);background:var(--fg);color:var(--panel);border-radius:12px;padding:10px 14px;font:500 14px/1.3 var(--font-display);box-shadow:0 8px 24px var(--shadow)}
.loading{position:fixed;z-index:6;inset:0;display:grid;place-items:center;background:var(--bg);font:500 15px/1.4 var(--font-display);color:var(--muted);transition:opacity .4s}
.credit{position:fixed;z-index:3;right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 2px);font-size:10.5px;color:var(--muted);background:color-mix(in srgb,var(--panel) 70%,transparent);padding:2px 6px;border-radius:5px}
.credit a{color:inherit}
@media (max-width:640px){
  .sheet{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);left:16px;right:16px;width:auto;max-height:66%}
  .photo img{aspect-ratio:16/9}
  .brand p.hint{display:none}
  .credit{bottom:calc(env(safe-area-inset-bottom,0px) + 74px)}
}
</style>
<!--HEAD-END-->
</head>
<body>
<!--BODY-START-->
<div id="stage"></div>
<div id="labels"></div>
<div class="loading" id="loading">กำลังโหลดแผนที่…</div>

<header class="brand">
  <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="10" fill="var(--accent-soft)"/><rect x="10" y="7" width="14" height="20" rx="2.5" fill="var(--accent)"/><rect x="12.5" y="9.5" width="6" height="11" rx="1" fill="var(--panel)"/><rect x="20" y="10" width="2" height="4" rx="1" fill="var(--panel)"/><rect x="12.5" y="22.5" width="9" height="2.2" rx="1.1" fill="var(--panel)"/></svg>
  <div>
    <h1>LAUM เขื่องใน</h1>
    <p><span class="live" id="liveState"><i></i><span>กำลังเชื่อมต่อ…</span></span></p>
    <p class="hint">ลากเพื่อหมุน · เลื่อนล้อเพื่อซูม · คลิกที่ตู้เพื่อดูสินค้า</p>
  </div>
</header>

<nav class="dock" id="dock" aria-label="จุดตั้งตู้"></nav>

<aside class="sheet" id="sheet" hidden aria-live="polite">
  <button class="close" id="sheetClose" aria-label="ปิด">×</button>
  <div id="sheetBody"></div>
</aside>

<div class="bar" id="placeBar" hidden></div>
<div class="toast" id="toast" hidden></div>

<div class="credit">แผนที่ © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a></div>

<script src="map-data.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* ================= ตั้งค่า ================= */
// Apps Script ตัวเดียวกับหน้าเว็บหลัก (index.html) — ว่าง = โหมดออฟไลน์ใช้ข้อมูลตั้งต้น
const GAS_URL = "https://script.google.com/macros/s/AKfycbywOvRyloDD1XJxLTAHsmm7t7ev95sKtndUd6jM37NI4lMMA6xS2lTl6zQfNXV_53UlJw/exec";
const REFRESH_MS = 120000;   // ดึงสต็อกใหม่ทุก 2 นาที
const HOURS = 'เปิด 24 ชั่วโมง';
const MODELS = {
  fuji_can:    { label:'FUJI CAN',     type:'ตู้กดเครื่องดื่ม', detail:'น้ำดื่ม ชา น้ำอัดลม เครื่องดื่มเย็น' },
  fuji_spiral: { label:'FUJI Twistar', type:'ตู้เกลียว',       detail:'ขนมและมาม่า' },
};
const HOME = { lat:15.388446, lng:104.551576 };   // จุดที่ 1 หน้าบ้าน (ปั้นตามรูปจริง)
// ใช้เมื่อชีต Fleet ยังไม่มีพิกัดของตู้นั้น
const DEFAULT_PLACES = {
  M1:  { lat:HOME.lat, lng:HOME.lng, model:'fuji_can',    photo:'photos/site1.jpg', order:0 },
  KC2: { lat:HOME.lat, lng:HOME.lng, model:'fuji_spiral', photo:'photos/site1.jpg', order:1 },
};
const OFFLINE_FLEET = [ { id:'M1', name:'ตู้ฟูจิ', products:[] }, { id:'KC2', name:'FUJI Twistar', products:[] } ];
/* ========================================== */

const D = window.MAP_DATA;
const LAT0 = 15.388446, LON0 = 104.551576;
const KX = 111320*Math.cos(LAT0*Math.PI/180), KZ = 110540;
const toXZ = (lat,lng)=>[(lng-LON0)*KX, -(lat-LAT0)*KZ];
const toLL = (x,z)=>[LAT0 - z/KZ, LON0 + x/KX];
const HALF = 445;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const isSmall = Math.min(innerWidth, innerHeight) < 700;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);
const store = { get(k){ try{ return sessionStorage.getItem(k)||''; }catch(e){ return ''; } }, set(k,v){ try{ v ? sessionStorage.setItem(k,v) : sessionStorage.removeItem(k); }catch(e){} } };

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd = mulberry32(20261012);
const pick = a => a[Math.floor(rnd()*a.length)];

/* ---------- data from LAUM (Apps Script) ---------- */
let ownerKey = store.get('laum-map-key');
let live = false, fleet = [], isOwner = false, updatedAt = null;
async function gas(opts){
  if(!GAS_URL) return null;
  const ctl = new AbortController(), tm = setTimeout(()=>ctl.abort(), 15000);
  try{
    const res = opts ? await fetch(GAS_URL, { method:'POST', redirect:'follow', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(opts), signal:ctl.signal })
                     : await fetch(GAS_URL+'?action=map', { cache:'no-store', redirect:'follow', signal:ctl.signal });
    return await res.json();
  }catch(e){ return null; } finally{ clearTimeout(tm); }
}
async function loadFleet(){
  const j = await gas(ownerKey ? { action:'map_owner', key:ownerKey } : null);
  if(j && j.ok && Array.isArray(j.machines)){
    live = true; fleet = j.machines; isOwner = !!j.owner; updatedAt = new Date(j.updatedAt||Date.now());
    if(ownerKey && !isOwner){ ownerKey=''; store.set('laum-map-key',''); }
  }else if(!fleet.length){
    live = false; fleet = OFFLINE_FLEET; isOwner = false;
  }
  syncLive();
}
function syncLive(){
  const el=$('liveState');
  el.className = 'live' + (live?' on':'');
  el.lastChild.textContent = live
    ? `ข้อมูลสด · อัปเดต ${updatedAt.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})}${isOwner?' · โหมดเจ้าของ':''}`
    : 'ออฟไลน์ · แสดงตำแหน่งตู้อย่างเดียว';
}
function machinesNow(){
  return fleet.filter(m=>m.on!==false).map(m=>{
    const d = DEFAULT_PLACES[m.id] || {};
    const has = m.lat!=null && m.lng!=null && m.lat!=='' && !isNaN(m.lat);
    const model = MODELS[m.model] ? m.model : (d.model || (/^KC/i.test(m.id) ? 'fuji_spiral' : 'fuji_can'));
    const fb = m.hidden ? {} : d;   // removed by the owner: don't fall back to the default spot
    return { ...m, model, lat: has?Number(m.lat):fb.lat, lng: has?Number(m.lng):fb.lng, photo: m.photo||d.photo||'', order: d.order ?? 9, products: m.products||[] };
  });
}
function stockOf(m){
  const ps=m.products||[]; if(!ps.length) return null;
  const tot=ps.reduce((a,p)=>a+(+p.maxQty||0),0), now=ps.reduce((a,p)=>a+Math.max(0,+p.stock||0),0);
  return { tot, now, out: ps.filter(p=>(+p.stock||0)<=0).length, slots: ps.length };
}
function driveImg(url){
  if(!url) return '';
  let m=url.match(/\/file\/d\/([\w-]+)/) || url.match(/[?&]id=([\w-]+)/);
  return m ? 'https://drive.google.com/thumbnail?id='+m[1]+'&sz=w200' : url;
}

/* ---------- renderer / scene ---------- */
const stage = $('stage');
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true, logarithmicDepthBuffer:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 1, .5, 6000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = 1.36;
controls.minDistance = 7;
controls.maxDistance = 1900;
controls.autoRotate = !reduceMotion;
controls.autoRotateSpeed = 0.35;
controls.addEventListener('start', ()=>{ controls.autoRotate = false; fly = null; });

const hemi = new THREE.HemisphereLight('#e4f4ff', '#b8c79c', 1.5);
scene.add(hemi);
const sun = new THREE.DirectionalLight('#fff0d4', 2.6);
const SUN_OFF = new THREE.Vector3(380, 760, 300);
sun.position.copy(SUN_OFF);
sun.castShadow = true;
sun.shadow.mapSize.set(isSmall?2048:4096, isSmall?2048:4096);
Object.assign(sun.shadow.camera, { left:-560, right:560, top:560, bottom:-560, near:10, far:2600 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.6;
scene.add(sun); scene.add(sun.target);

const matCache = new Map();
function mat(color, opts={}){
  const key = color + JSON.stringify(opts);
  if(!matCache.has(key)) matCache.set(key, new THREE.MeshStandardMaterial({ color, roughness:.85, metalness:0, flatShading:true, ...opts }));
  return matCache.get(key);
}

  const [ax,az]=r.p[i], [bx,bz]=r.p[i+1], len=Math.hypot(bx-ax,bz-az);

function nearestRoad(x,z,filter){
  let best=null, bd=1e9;
  for(const s of SEGS){
    if(filter && !filter(s)) continue;
    const t=Math.max(0,Math.min(s.len,(x-s.ax)*s.ux+(z-s.az)*s.uz));
    const px=s.ax+s.ux*t, pz=s.az+s.uz*t, d=Math.hypot(x-px,z-pz);
    if(d<bd){ bd=d; best={s,px,pz,d}; }
  }
  return best;
}
function roadClear(x,z){
  let m=1e9;
  for(const s of SEGS){
    const t=Math.max(0,Math.min(s.len,(x-s.ax)*s.ux+(z-s.az)*s.uz));
    const d=Math.hypot(x-(s.ax+s.ux*t),z-(s.az+s.uz*t))-s.w/2;

}

const bottleGeo = new THREE.LatheGeometry([[0,0],[.48,0],[.55,.12],[.55,1.15],[.42,1.45],[.2,1.72],[.2,1.95],[0,1.95]].map(([a,b])=>new THREE.Vector2(a,b)), 24);
const siteLayer = new THREE.Group(); scene.add(siteLayer);
let SITES=[], MACH=[], pickables=[], visitors=[];
const POLES=[];
function groupSites(list){
  const sites=[];
  for(const m of list.filter(m=>m.lat!=null && m.lng!=null).sort((a,b)=>a.order-b.order || a.id.localeCompare(b.id))){
    const [x,z]=toXZ(m.lat,m.lng);
    let s=sites.find(s=>Math.hypot(s.x-x,s.z-z)<10);
    if(!s){ s={x,z,lat:m.lat,lng:m.lng,machines:[]}; sites.push(s); }
    s.machines.push(m);
  }
  const [hx,hz]=toXZ(HOME.lat,HOME.lng);
  for(const s of sites){ s.home=Math.hypot(s.x-hx,s.z-hz)<15; s.dist=Math.hypot(s.x-hx,s.z-hz); }
  sites.sort((a,b)=>a.dist-b.dist);
  sites.forEach((s,i)=>{
    s.id='s'+(i+1); s.name='จุดที่ '+(i+1);
    s.place = s.machines.find(m=>m.loc)?.loc || (s.home ? 'ใต้ชายคาบ้าน ริมซอย' : '');
    s.photo = s.machines.find(m=>m.photo)?.photo || '';
  });
  return sites;
}
function buildSite(s){
  const b=nearestRoad(s.x,s.z,r=>!['path','footway','track'].includes(r.k));
  let nx=s.x-b.px, nz=s.z-b.pz, L=Math.hypot(nx,nz);
  if(L<0.3){ nx=-b.s.uz; nz=b.s.ux; L=1; }
  nx/=L; nz/=L;
  s.fx=-nx; s.fz=-nz;
  const ox=b.px+nx*(b.s.w/2+1.4), oz=b.pz+nz*(b.s.w/2+1.4);
  s.model = s.home ? 'shop' : 'kiosk';
  const grp = s.home ? buildShop(s) : buildKiosk(s);
  grp.position.set(ox,0,oz); grp.rotation.y=Math.atan2(s.fx,s.fz);
  siteLayer.add(grp); grp.updateMatrixWorld(true);
  const W2=(lx,ly,lz)=>new THREE.Vector3(lx,ly,lz).applyMatrix4(grp.matrixWorld);
  const c=W2(0,0,s.home?-8:-3.6);
  Object.assign(s,{ group:grp, cx:c.x, cz:c.z, W2, markerY:s.home?12.5:6.5 });
  const marker=new THREE.Group();
  marker.add(mesh(bottleGeo, glowMat({color:'#43b0ff',roughness:.2,emissive:'#2e9cf0',emissiveIntensity:.25,flatShading:false},.25,1.4,siteNight)));
  const cap=mesh(new THREE.CylinderGeometry(.24,.24,.3,16),mat('#ffffff')); cap.position.y=2.05; marker.add(cap);
  const band=mesh(new THREE.CylinderGeometry(.565,.565,.45,24),mat('#ffffff')); band.position.y=.6; marker.add(band);
  marker.scale.setScalar(1.5); marker.position.set(c.x,s.markerY,c.z); siteLayer.add(marker);
  const ringMat=new THREE.MeshBasicMaterial({color:'#3aa6f5',transparent:true,opacity:.5,depthWrite:false});
  const fr=W2(0,0,s.home?-2.6:-1.4);
  const ring=new THREE.Mesh(new THREE.RingGeometry(s.home?5.2:3.6,s.home?6:4.2,56),ringMat); ring.rotation.x=-Math.PI/2; ring.position.set(fr.x,.4,fr.z); siteLayer.add(ring);
  const light=new THREE.PointLight('#ffe9c2',0,22,1.4); light.position.copy(W2(s.home?-1.5:0,3,s.home?-6.5:-3)); siteLayer.add(light);
  Object.assign(s,{marker,ring,ringMat,light});
  const hit=new THREE.Mesh(new THREE.CylinderGeometry(s.home?9:6,s.home?9:6,16,12),new THREE.MeshBasicMaterial({visible:false}));
  hit.position.set(c.x,8,c.z); hit.userData.site=s.id; siteLayer.add(hit); pickables.push(hit);
  for(const m of s.machines){
    m.site=s;
    const [w,h,d]=m.obj.userData.size, wp=new THREE.Vector3(); m.obj.getWorldPosition(wp);
    m.x=wp.x; m.z=wp.z; m.top=wp.y+h;
    m.frontX=wp.x+s.fx*(d/2+.9); m.frontZ=wp.z+s.fz*(d/2+.9);
    const mh=new THREE.Mesh(new THREE.BoxGeometry(w+.2,h+.3,d+.2),new THREE.MeshBasicMaterial({visible:false}));
    m.obj.add(mh); mh.position.y=h/2; mh.userData.mid=m.id; pickables.push(mh);
    MACH.push(m);
  }
  if(s.home){
    const ux=b.s.ux, uz=b.s.uz, side=b.s.w/2+.9;
    const poles=[-34,1,36].map(k=>{
      const along=k + ((ox-b.px)*ux+(oz-b.pz)*uz);
      return new THREE.Vector3(b.px+ux*along+nx*side, 0, b.pz+uz*along+nz*side);
    });
    for(const p of poles){
      const pole=mesh(new THREE.CylinderGeometry(.16,.24,10.5,8),mat('#b9b6ad')); pole.position.set(p.x,5.25,p.z); siteLayer.add(pole);
      const arm=mesh(new THREE.BoxGeometry(.14,.14,2.2),mat('#8d949b')); arm.position.set(p.x,9.7,p.z); arm.rotation.y=Math.atan2(nx,nz); siteLayer.add(arm);
      POLES.push(p);
    }
    const wm=mat('#24272c');
    for(let i=0;i<poles.length-1;i++) for(const [dy,off] of [[9.55,-.7],[9.55,.6],[8.9,0],[8.6,.25]]){
      const a=poles[i].clone().add(new THREE.Vector3(nx*off,dy,nz*off)), e=poles[i+1].clone().add(new THREE.Vector3(nx*off,dy,nz*off));
      const mid=a.clone().lerp(e,.5); mid.y-=1.1;
      siteLayer.add(mesh(new THREE.TubeGeometry(new THREE.QuadraticBezierCurve3(a,mid,e),24,.045,5),wm,{receive:false}));
    }
  }
  s.clear = s.home ? 15 : 7;
}
const nearSite = (x,z,r)=> SITES.some(s=>Math.hypot(s.cx-x,s.cz-z) < s.clear+r) || POLES.some(p=>Math.hypot(p.x-x,p.z-z)<r+2);

    dummy.position.set(o.x+fx*(o.d/2+.05)+rx*o.w*.22, Math.min(o.h*.55,2.3), o.z+fz*(o.d/2+.05)+rz*o.w*.22); dummy.updateMatrix(); wins.setMatrixAt(i,dummy.matrix);
  });

  for(let k=0;k<6000 && trees.length<(isSmall?650:950);k++){

/* ---------- routes for traffic & walkers ---------- */
function makeRoute(r){
  const cum=[0]; for(let i=1;i<r.p.length;i++) cum.push(cum[i-1]+Math.hypot(r.p[i][0]-r.p[i-1][0], r.p[i][1]-r.p[i-1][1]));
  return { p:r.p, cum, len:cum[cum.length-1], w:r.w, k:r.k };
}
function sample(rt, s){
  s=Math.max(0,Math.min(rt.len-1e-3,s));
  let i=1; while(i<rt.cum.length-1 && rt.cum[i]<s) i++;
  const [ax,az]=rt.p[i-1],[bx,bz]=rt.p[i], L=rt.cum[i]-rt.cum[i-1]||1, t=(s-rt.cum[i-1])/L;
  return { x:ax+(bx-ax)*t, z:az+(bz-az)*t, ux:(bx-ax)/L, uz:(bz-az)/L };
}
const carRoutes=[], walkRoutes=[];
for(const r of D.roads){
  const rt=makeRoute(r);
  if(rt.len<50) continue;
  const wt={trunk:5,trunk_link:1,secondary:4,tertiary:3,unclassified:2,residential:1.4,service:.5}[r.k]||0;
  for(let i=0;i<Math.round(wt*rt.len/120);i++) carRoutes.push(rt);
  if(['residential','service','unclassified','path','footway','secondary'].includes(r.k)) walkRoutes.push(rt);
}

  placing={...p, at:null};
  closeSheet(); stage.classList.add('placing');
  if(camera.position.distanceTo(controls.target)<120) flyTo(controls.target.x,0,controls.target.z,260,.75);
  renderBar();
}
function renderBar(){
  const p=placing; bar.hidden=false;
  const ll = p.at ? toLL(p.at.x,p.at.z) : null;
  bar.innerHTML = `<p>${p.at?`วาง ${esc(p.name)} ตรงนี้?`:`แตะบนแผนที่ตรงจุดที่ตั้ง ${esc(p.name)}`}
      <small>${p.at?`${ll[0].toFixed(6)}, ${ll[1].toFixed(6)} · ตู้จะหันหน้าออกถนนที่ใกล้ที่สุด`:`${esc(MODELS[p.model].label)} · ซูมเข้าไปใกล้ๆ ได้ก่อนแตะ`}</small></p>
    <div class="actions">${p.at?`<button class="btn primary small" type="button" id="pSave">บันทึกตำแหน่ง</button>`:''}<button class="btn small" type="button" id="pCancel">ยกเลิก</button></div>`;
  $('pCancel').onclick=cancelPlacing;
  if(p.at) $('pSave').onclick=savePlacing;
}
function cancelPlacing(){ placing=null; bar.hidden=true; stage.classList.remove('placing'); if(ghost){ scene.remove(ghost); ghost=null; } }
async function savePlacing(){
  const p=placing, [lat,lng]=toLL(p.at.x,p.at.z);
  $('pSave').disabled=true; $('pSave').textContent='กำลังบันทึก…';
  const j=await gas({action:'map_place', key:ownerKey, id:p.id, name:p.isNew?p.name:undefined, model:p.model, lat:+lat.toFixed(7), lng:+lng.toFixed(7)});
  if(j&&j.ok){
    cancelPlacing(); toast(`บันทึกตำแหน่ง ${p.name} แล้ว`);
    await refresh(true);
    const s=SITES.find(s=>s.machines.some(m=>m.id===p.id)); if(s) openSite(s, s.machines.find(m=>m.id===p.id));
  }else{ $('pSave').disabled=false; $('pSave').textContent='บันทึกตำแหน่ง'; toast(j?.error||'บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง'); }
}
const groundPlane=new THREE.Plane(new THREE.Vector3(0,1,0),0), hitPt=new THREE.Vector3();
function placeAt(e){
  setRay(e);
  if(!ray.ray.intersectPlane(groundPlane,hitPt)) return;
  if(Math.abs(hitPt.x)>HALF || Math.abs(hitPt.z)>HALF){ toast('จุดนี้อยู่นอกแผนที่'); return; }
  placing.at={x:hitPt.x,z:hitPt.z};
  if(!ghost){ ghost=buildVending(placing.model,[],true,[]); scene.add(ghost); }
  const b=nearestRoad(hitPt.x,hitPt.z); ghost.position.set(hitPt.x,0,hitPt.z); ghost.rotation.y=Math.atan2(b.px-hitPt.x,b.pz-hitPt.z);
  renderBar();
}

/* ---------- camera moves ---------- */
let fly=null;
function flyTo(x,y,z,dist,polar,az){
  controls.autoRotate=false;
  az ??= Math.atan2(camera.position.x-controls.target.x, camera.position.z-controls.target.z);
  const to={ t:new THREE.Vector3(x,y,z) };
  to.p=to.t.clone().add(new THREE.Vector3(Math.sin(polar)*Math.sin(az), Math.cos(polar), Math.sin(polar)*Math.cos(az)).multiplyScalar(dist));
  fly={ fp:camera.position.clone(), ft:controls.target.clone(), to, t0:performance.now(), dur:reduceMotion?1:1400 };
}
function overview(){ flyTo(0,0,0, W/H<1?1700:1000, .9); }

/* ---------- picking ---------- */
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
function setRay(e){
  const r=renderer.domElement.getBoundingClientRect();
  ndc.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ndc,camera);
}
function hitAt(e){
  setRay(e);
  const hits=ray.intersectObjects(pickables,false);
  if(!hits.length) return null;
  const mh=hits.find(h=>h.object.userData.mid);
  if(mh){ const m=MACH.find(m=>m.id===mh.object.userData.mid); return {s:m.site, m}; }
  return { s:SITES.find(s=>s.id===hits[0].object.userData.site) };
}
let downAt=null;
renderer.domElement.addEventListener('pointerdown',e=>{ downAt=[e.clientX,e.clientY]; });
renderer.domElement.addEventListener('pointerup',e=>{
  if(!downAt || Math.hypot(e.clientX-downAt[0],e.clientY-downAt[1])>6) return;
  if(placing){ placeAt(e); return; }
  const h=hitAt(e); if(h) openSite(h.s, h.m);
});
renderer.domElement.addEventListener('pointermove',e=>{ if(e.buttons||placing) return; renderer.domElement.style.cursor = hitAt(e) ? 'pointer' : ''; });

/* ---------- sizing ---------- */
let W=1,H=1;
function resize(){ W=stage.clientWidth; H=stage.clientHeight; renderer.setSize(W,H); camera.aspect=W/H; camera.updateProjectionMatrix(); }
addEventListener('resize',resize); resize();
{
  const d = W/H<1 ? 1700 : 1000, polar=.9, az=.62;
  camera.position.set(Math.sin(polar)*Math.sin(az)*d, Math.cos(polar)*d, Math.sin(polar)*Math.cos(az)*d);
  controls.target.set(0,0,0); controls.update();
}

/* ---------- build everything, then keep the stock fresh ---------- */
rebuildSites();
buildScenery();
$('loading').style.opacity='0'; setTimeout(()=>$('loading').remove(),450);
// ปุ่ม "แผนที่ 3D" ในหน้าจัดการลิงก์มาที่ /map/#owner → เปิดหน้าเจ้าของให้เลย
if(location.hash==='#owner'){ openOwner(); history.replaceState(null,'',location.pathname); }
async function refresh(force){
  const before=JSON.stringify(fleet);
  await loadFleet();
  if(!force && JSON.stringify(fleet)===before) return;
  rebuildSites();
  // keep an open site card in step with the new stock, without moving the camera
  if(openState?.type==='site'){
    const s=SITES.find(s=>s.id===openState.id);
    if(s) openSite(s, s.machines.find(m=>m.id===openState.mid), {fly:false}); else closeSheet();
  }
}
setInterval(()=>{ if(!document.hidden && !placing) refresh(false); }, REFRESH_MS);

/* ---------- animation ---------- */
const DAY={hemiSky:new THREE.Color('#e4f4ff'),hemiGround:new THREE.Color('#b8c79c'),sun:new THREE.Color('#fff0d4')};
const NIGHT={hemiSky:new THREE.Color('#5a6f9e'),hemiGround:new THREE.Color('#1d2636'),sun:new THREE.Color('#9db4ff')};
const clock=new THREE.Clock();
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
let shadowHalf=560;

function stepVehicle(v,dt){
  v.s += v.dir*v.speed*dt;
  const atEnd = v.dir>0 ? v.s>=v.rt.len-2 : v.s<=2;
  if(atEnd){ v.pop-=dt*3; if(v.pop<=0){ placeVehicle(v); } }
  else v.pop=Math.min(1,v.pop+dt*3);
  const p=sample(v.rt,v.s), ux=p.ux*v.dir, uz=p.uz*v.dir, off=v.rt.w*.23;  // Thailand drives on the left
  v.g.position.set(p.x+uz*off, 0, p.z-ux*off);
  v.g.rotation.y=Math.atan2(ux,uz);
  v.g.scale.setScalar(Math.max(.001,ease(Math.max(0,v.pop))));
}
function stepWalker(w,dt,t){
  w.s += w.dir*w.speed*dt;
  if(w.s>w.rt.len-1){ w.s=w.rt.len-1; w.dir=-1; }
  if(w.s<1){ w.s=1; w.dir=1; }
  const p=sample(w.rt,w.s), ux=p.ux*w.dir, uz=p.uz*w.dir, off=w.rt.w/2+1.1;
  w.g.position.set(p.x+uz*off, .35, p.z-ux*off);
  w.g.rotation.y=Math.atan2(ux,uz);
  if(!reduceMotion){ w.inner.position.y=Math.abs(Math.sin(t*9+w.ph))*.3; w.inner.rotation.z=Math.sin(t*9+w.ph)*.06; }
}
function stepVisitor(v,dt,t){
  const walk=(spd)=>{
    const b=v.path[v.idx], p=v.g.position, dx=b.x-p.x, dz=b.z-p.z, L=Math.hypot(dx,dz), st=spd*dt;
    if(L<=st){ p.x=b.x; p.z=b.z; v.idx++; return v.idx>=v.path.length; }
    p.x+=dx/L*st; p.z+=dz/L*st; v.g.rotation.y=Math.atan2(dx,dz);
    if(!reduceMotion) v.inner.position.y=Math.abs(Math.sin(t*10+v.ph))*.22;
    return false;
  };
  v.t-=dt;
  if(v.phase==='wait'){
    v.g.visible=false;
    if(v.t<=0){
      v.m=pick(v.s.machines);
      v.path=[v.gate,{x:v.m.frontX,z:v.m.frontZ}]; v.idx=0; v.g.position.set(v.start.x,.2,v.start.z);
      v.phase='in'; v.g.visible=true; v.item.visible=false;
    }
  }else if(v.phase==='in'){
    if(walk(1.7)){ v.phase='buy'; v.t=3; v.g.rotation.y=Math.atan2(-v.s.fx,-v.s.fz); v.inner.position.y=0; v.g.position.y=.26; }
  }else if(v.phase==='buy'){
    v.m.buying=1;
    if(v.t<=0){ v.phase='out'; v.item.visible=true; v.path=[v.gate,v.start]; v.idx=0; v.g.position.y=.2; }
  }else if(v.phase==='out'){
    if(walk(1.7)){ v.phase='wait'; v.t=3+rnd()*7; }
  }
}

function frame(){
  const dt=Math.min(clock.getDelta(),.05), t=clock.elapsedTime;
  if(fly){
    const k=Math.min(1,(performance.now()-fly.t0)/fly.dur), e=ease(k);
    camera.position.lerpVectors(fly.fp,fly.to.p,e); controls.target.lerpVectors(fly.ft,fly.to.t,e);
    if(k>=1) fly=null;
  }
  controls.update();
  const camDist=camera.position.distanceTo(controls.target);
  // keep shadows crisp: the sun's shadow box follows the view and shrinks when zoomed in
  const half=THREE.MathUtils.clamp(camDist*.8,25,560);
  if(Math.abs(half-shadowHalf)>shadowHalf*.08){
    shadowHalf=half; Object.assign(sun.shadow.camera,{left:-half,right:half,top:half,bottom:-half}); sun.shadow.camera.updateProjectionMatrix();
    sun.shadow.normalBias=.02+half*.001;
  }
  sun.position.copy(controls.target).add(SUN_OFF); sun.target.position.copy(controls.target); sun.target.updateMatrixWorld();
  nightT += ((night?1:0)-nightT)*Math.min(1,dt*2.5);
  stage.style.setProperty('--night', nightT.toFixed(3));
  hemi.color.copy(DAY.hemiSky).lerp(NIGHT.hemiSky,nightT);
  hemi.groundColor.copy(DAY.hemiGround).lerp(NIGHT.hemiGround,nightT);
  hemi.intensity=1.5-0.8*nightT;
  sun.color.copy(DAY.sun).lerp(NIGHT.sun,nightT); sun.intensity=2.6-2.25*nightT;
  for(const n of nightMats) n.m.emissiveIntensity=n.day+(n.night-n.day)*nightT;
  for(const n of siteNight) n.m.emissiveIntensity=n.day+(n.night-n.day)*nightT;
  for(const m of waterMats) m.emissiveIntensity=.12+Math.sin(t*1.5)*.05;
  const close = camDist < 80;
  for(const s of SITES){
    const busy = s.machines.some(m=>m.buying);
    if(!reduceMotion){ s.marker.position.y=s.markerY+Math.sin(t*2+s.cx)*.5; s.marker.rotation.y+=dt*(1+(busy?3:0)); }
    const k=(t*.6)%1;
    s.ring.scale.setScalar(1+k*.8); s.ringMat.opacity=.5*(1-k);
    s.light.intensity = nightT*90;
    if(close && Math.hypot(controls.target.x-s.cx, controls.target.z-s.cz) < 40) hide(s.label);
    else place(s.label, s.cx, s.markerY+4, s.cz, 4);
  }
  for(const m of MACH){
    const n=m.site.machines.length, i=m.site.machines.indexOf(m);
    if(close) place(m.label, m.x, m.top+.5, m.z, 2, n<2?'-50%':i===0?'calc(-100% + 6px)':i===n-1?'-6px':'-50%'); else hide(m.label);
    m.buying=0;
  }
  for(const l of landmarks) place(l.el, l.x, l.y, l.z);
  if(ghost && !reduceMotion) ghost.position.y=Math.abs(Math.sin(t*4))*.4;
  for(const c of clouds){ c.position.x+=c.userData.v*dt; if(c.position.x>650) c.position.x=-650; }
  for(const v of vehicles) stepVehicle(v,dt);
  for(const w of walkers) stepWalker(w,dt,t);
  for(const v of visitors) stepVisitor(v,dt,t);
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
frame();
</script>
